# Public vitrin — point takibi.com / www.takibi.com A records to this host, then:
#   sudo cp deploy/nginx-takibi.conf /etc/nginx/sites-available/takibi
#   sudo ln -sf /etc/nginx/sites-available/takibi /etc/nginx/sites-enabled/takibi
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d takibi.com -d www.takibi.com

server {
    listen 80;
    listen [::]:80;
    server_name takibi.com www.takibi.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
