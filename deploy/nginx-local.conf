# Local ERP — single browser origin: http://127.0.0.1/
#
# localhost and 127.0.0.1 are different origins (separate cookies / localStorage).
# Serving both "the same app" still forks login sessions. Always 301 localhost here.
#
#   sudo cp deploy/nginx-local.conf /etc/nginx/sites-available/tamkobi
#   sudo ln -sfn /etc/nginx/sites-available/tamkobi /etc/nginx/sites-enabled/tamkobi
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    return 301 http://127.0.0.1$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 127.0.0.1 _;
    client_max_body_size 25m;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # Panel tarayıcı eklentisi ZIP (SPA'ya düşmesin)
    location ^~ /downloads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
