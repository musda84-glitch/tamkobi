# TamKobi canlı site — HTTPS, www→apex, güvenlik başlıkları, sıkıştırma
# Kurulum: deploy/nginx/KURULUM.md
#
# Not: Certbot sertifikaları varsa ssl_certificate satırlarını açın.
# deploy/update-native.sh bu dosyayı otomatik kopyalamaz; elle uygulayın.

# --- HTTP → HTTPS (80) ---
server {
    listen 80;
    listen [::]:80;
    server_name tamkobi.com www.tamkobi.com;
    return 301 https://tamkobi.com$request_uri;
}

# --- www → apex (443) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tamkobi.com;

    # ssl_certificate     /etc/letsencrypt/live/tamkobi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tamkobi.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tamkobi.com$request_uri;
}

# --- Ana site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tamkobi.com;

    # ssl_certificate     /etc/letsencrypt/live/tamkobi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tamkobi.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 25m;

    root /var/www/tamkobi.com/frontend/build;
    index index.html;

    # Güvenlik
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Brotli (nginx-module-brotli yüklüyse açın)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location = /robots.txt { try_files $uri =404; access_log off; add_header Content-Type text/plain; }
    location = /sitemap.xml { try_files $uri =404; access_log off; add_header Content-Type application/xml; }
    error_page 404 /404.html;
    location = /404.html { internal; }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location ^~ /downloads/ {
        default_type application/zip;
        types { application/zip zip; }
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA: bilinen yollar index.html; diğerleri gerçek 404
    # (ERP uygulama rotaları da index.html ister — aşağıdaki regex geniş tutuldu)
    location / {
        try_files $uri $uri/ @spa_or_404;
    }

    location @spa_or_404 {
        # Dosya yoksa SPA kabuğu; bilinmeyen pazarlama yolları istemci 404 gösterir.
        # Tam HTTP 404 için yalnızca kesin olmayan yolları kısıtlamak gerekir;
        # ERP SPA yüzünden varsayılan index.html’dir. Statik eksik dosyalar =404.
        rewrite ^ /index.html last;
    }
}
