# TamKobi canlı site — HTTP tabanlı şablon (sertifika olmadan nginx -t geçer).
# Kurulum: deploy/nginx/KURULUM.md
#
# ÖNEMLİ: Certbot yönetimli canlı vhost’u bu dosyayla ezmeyin.
# SSL için: önce certbot, sonra deploy/nginx/tamkobi-ssl.conf.example içeriğini birleştirin.
#
# Snippet (bir kez):
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/tamkobi-security-headers.conf

# --- HTTP (80) — sertifika yokken site buradan servis edilir ---
server {
    listen 80;
    listen [::]:80;
    server_name tamkobi.com www.tamkobi.com;

    # IP’yi server_name’e eklemeyin (çerezler http://IP/ adresine gider).
    server_tokens off;
    client_max_body_size 25m;

    root /var/www/tamkobi.com/frontend/build;
    index index.html;

    include snippets/tamkobi-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location = /robots.txt {
        include snippets/tamkobi-security-headers.conf;
        try_files $uri =404;
        access_log off;
    }
    location = /sitemap.xml {
        include snippets/tamkobi-security-headers.conf;
        try_files $uri =404;
        access_log off;
    }
    error_page 404 /404.html;
    location = /404.html {
        include snippets/tamkobi-security-headers.conf;
        internal;
    }

    location /api {
        include snippets/tamkobi-security-headers.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # İstemci XFF’ini ezin — login kilidi bu değere bağlıdır.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location ^~ /downloads/ {
        include snippets/tamkobi-security-headers.conf;
        default_type application/zip;
        types { application/zip zip; }
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /static/ {
        include snippets/tamkobi-security-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        include snippets/tamkobi-security-headers.conf;
        try_files $uri $uri/ @spa_or_404;
    }

    location @spa_or_404 {
        include snippets/tamkobi-security-headers.conf;
        # ERP SPA yolları index.html ister; bilinmeyen pazarlama yolları istemci 404 gösterir.
        rewrite ^ /index.html last;
    }
}
