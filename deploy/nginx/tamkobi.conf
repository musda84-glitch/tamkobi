# TamKobi canlı site — HTTP tabanlı şablon (sertifika olmadan nginx -t geçer).
# Kurulum: deploy/nginx/KURULUM.md
#
# ÖNEMLİ: Certbot yönetimli canlı vhost’u bu dosyayla ezmeyin.
# SSL için: önce certbot, sonra deploy/nginx/tamkobi-ssl.conf.example içeriğini birleştirin.
#
# Snippet / map (bir kez) — KURULUM.md §A:
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/tamkobi-security-headers.conf
#   sudo cp deploy/nginx/spa-routes.map.conf /etc/nginx/conf.d/tamkobi-spa-routes.map.conf
#   (conf.d yeterli; snippet include isteğe bağlı)

# --- HTTP (80) — sertifika yokken site buradan servis edilir ---
# Canlıda IP bind: listen 85.95.240.184:80; (KURULUM.md)
server {
    listen 80;
    listen [::]:80;
    # listen 85.95.240.184:80;
    server_name tamkobi.com www.tamkobi.com;

    # IP’yi server_name’e eklemeyin (çerezler http://IP/ adresine gider).
    server_tokens off;
    client_max_body_size 25m;

    # Kesintisiz dağıtım: symlink → frontend-releases/<sha>
    root /var/www/tamkobi.com/frontend-current;
    index index.html;

    include snippets/tamkobi-security-headers.conf;

    # Alt alan adı 301'leri (panel → app, b2b, ik). /api ve /sistem yönlendirilmez.
    include /etc/nginx/snippets/tamkobi-site-redirects.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location = /robots.txt {
        include snippets/tamkobi-security-headers.conf;
        try_files $uri =404;
        access_log off;
    }
    location = /sitemap.xml {
        include snippets/tamkobi-security-headers.conf;
        try_files $uri =404;
        access_log off;
    }
    error_page 404 /404.html;
    location = /404.html {
        include snippets/tamkobi-security-headers.conf;
        internal;
    }

    location /api {
        include snippets/tamkobi-security-headers.conf;
        # upstream tamkobi_api ← /etc/nginx/conf.d/tamkobi-upstream.conf
        proxy_pass http://tamkobi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # İstemci XFF’ini ezin — login kilidi bu değere bağlıdır.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location ^~ /downloads/ {
        include snippets/tamkobi-security-headers.conf;
        default_type application/zip;
        types { application/zip zip; }
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /index.html {
        include snippets/tamkobi-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /static/ {
        include snippets/tamkobi-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # One-time handoff. Exact match so @spa_or_404 cannot serve index.html for /sso?code=
    location = /sso {
        include snippets/tamkobi-security-headers.conf;
        proxy_pass http://tamkobi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        include snippets/tamkobi-security-headers.conf;
        try_files $uri $uri/ @spa_or_404;
    }

    location @spa_or_404 {
        include snippets/tamkobi-security-headers.conf;
        # $tamkobi_spa ← spa-routes.map.conf (http include). Bilinmeyen URI → HTTP 404.
        if ($tamkobi_spa = 0) { return 404; }
        rewrite ^ /index.html last;
    }
}
