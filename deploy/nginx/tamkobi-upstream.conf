# TamKobi API upstream — managed by deploy scripts (blue/green 8000/8001).
# Install once:
#   sudo cp deploy/nginx/tamkobi-upstream.conf /etc/nginx/conf.d/tamkobi-upstream.conf
# Live port is rewritten atomically by update-native.sh / migrate / rollback.
upstream tamkobi_api {
    server 127.0.0.1:8000;
    keepalive 16;
}
