# Bilinen SPA rotaları → index.html (200). Diğerleri → HTTP 404.
#
# Tercihen /etc/nginx/conf.d/ altına kopyalayın (http {} otomatik include eder):
#   sudo cp deploy/nginx/spa-routes.map.conf /etc/nginx/conf.d/tamkobi-spa-routes.map.conf
# İsteğe bağlı: snippets + nginx.conf http { include …; }

map $uri $tamkobi_spa {
    default 0;
    / 1;
    # Vitrin / auth / platform
    ~*^/(web|fiyatlar|kayit|moduller|urunler|login|kurulum|yasal|sistem|b2b|sso)(/|$) 1;
    ~*^/(hakkimizda|hizmetler|referanslar|iletisim)(/|$) 1;
    ~*^/(portal|teklif|proje|ekstre|davet|odeme|yenile|sifre)(/|$) 1;
    # ERP uygulama + İK
    ~*^/(panel|invoices|dis-ticaret|contacts|banking|stock|hizli-satis|vpos|ecommerce|cargo)(/|$) 1;
    ~*^/(orders|purchase-orders|saha|warehouses|vehicles|production|personnel|personelim|mesai)(/|$) 1;
    ~*^/(ai-advisor|communication|hesap|settings|quotes|projects|surveys|support|accountant|yardim)(/|$) 1;
    ~*^/(installments|atolye|sayim|sevk|reports|dispatches|expenses|loans|cheques|trash|edoc-inbox|b2b-yonetim|islem-gecmisi)(/|$) 1;
}
