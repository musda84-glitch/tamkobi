# Bilinen SPA rotaları → index.html (200). Diğerleri → 404.
# http {} içinde include edin (server bloğunda map olmaz):
#   include /etc/nginx/snippets/tamkobi-spa-routes.map.conf;
#
# Kurulum: sudo cp deploy/nginx/spa-routes.map.conf /etc/nginx/snippets/tamkobi-spa-routes.map.conf

map $uri $tamkobi_spa {
    default 0;
    =/ 1;
    # Vitrin / auth / platform
    ~*^/(web|fiyatlar|kayit|login|kurulum|yasal|sistem|b2b)(/|$) 1;
    ~*^/(portal|teklif|proje|ekstre|davet|odeme|yenile|sifre)(/|$) 1;
    # ERP uygulama
    ~*^/(panel|invoices|dis-ticaret|contacts|banking|stock|hizli-satis|ecommerce|cargo)(/|$) 1;
    ~*^/(orders|purchase-orders|saha|warehouses|vehicles|production|personnel|personelim|mesai)(/|$) 1;
    ~*^/(ai-advisor|communication|hesap|settings|quotes|projects|surveys|support|accountant)(/|$) 1;
    ~*^/(installments|atolye|sayim|sevk|reports|dispatches|expenses|loans|cheques|trash|edoc-inbox|b2b-yonetim)(/|$) 1;
}
