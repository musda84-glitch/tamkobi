# Include inside the tamkobi.com (apex) server block.
# Panel / B2B / İK paths → 301 to the owning subdomain (query string preserved).
#
# ASLA yönlendirme: /api/, /sistem, /yasal/, /web, /kayit, /kurulum,
#                   statik dosyalar, robots.txt, sitemap.xml

# --- ERP panel → app.tamkobi.com ---
location ~ ^/(panel|login|invoices|dis-ticaret|contacts|banking|stock|hizli-satis|ecommerce|cargo)(/|$) {
    return 301 https://app.tamkobi.com$request_uri;
}
location ~ ^/(orders|purchase-orders|saha|warehouses|vehicles|production|personnel|ai-advisor|communication)(/|$) {
    return 301 https://app.tamkobi.com$request_uri;
}
location ~ ^/(hesap|settings|quotes|projects|surveys|support|accountant|installments|reports|dispatches)(/|$) {
    return 301 https://app.tamkobi.com$request_uri;
}
location ~ ^/(expenses|loans|cheques|trash|edoc-inbox|b2b-yonetim|atolye|sayim|sevk)(/|$) {
    return 301 https://app.tamkobi.com$request_uri;
}
location ~ ^/(teklif|proje|ekstre|davet|odeme|yenile|sifre)(/|$) {
    return 301 https://app.tamkobi.com$request_uri;
}

# --- B2B portal → b2b.tamkobi.com ---
location = /b2b {
    return 301 https://b2b.tamkobi.com/b2b/giris;
}
location ^~ /b2b/ {
    return 301 https://b2b.tamkobi.com$request_uri;
}
location = /portal {
    return 301 https://b2b.tamkobi.com$request_uri;
}
location ^~ /portal/ {
    return 301 https://b2b.tamkobi.com$request_uri;
}

# --- Çalışan self-servis → ik.tamkobi.com ---
location = /personelim {
    return 301 https://ik.tamkobi.com$request_uri;
}
location ^~ /personelim/ {
    return 301 https://ik.tamkobi.com$request_uri;
}
location = /mesai {
    return 301 https://ik.tamkobi.com$request_uri;
}
location ^~ /mesai/ {
    return 301 https://ik.tamkobi.com$request_uri;
}
