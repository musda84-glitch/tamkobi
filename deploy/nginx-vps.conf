# TLS / canlı VPS — güncel HTTP şablon: deploy/nginx/tamkobi.conf
# Kurulum: deploy/nginx/KURULUM.md · SSL örneği: deploy/nginx/tamkobi-ssl.conf.example
#
# Bu dosyayı certbot yönetimli vhost’un ÜZERİNE kopyalamayın — sertifikalar düşer.
# HTTPS için:
#   sudo certbot --nginx -d tamkobi.com -d www.tamkobi.com
#
# Sertifika yokken HTTP-only fallback (aşağıdaki server bloğu).
# - server_name’e genel IP eklemeyin (çerezler http://IP/ adresine gider)
# - X-Forwarded-For / X-Real-IP yalnızca $remote_addr (login kilidi buna bağlı)
# deploy/update-native.sh bu dosyayı asla kurmaz.

# Sertifika sonrası tipik yönlendirme (certbot sonrası elle veya ssl örneği):
# server {
#     listen 80;
#     server_name tamkobi.com www.tamkobi.com;
#     return 301 https://tamkobi.com$request_uri;
# }

server {
    listen 80;
    server_name tamkobi.com www.tamkobi.com;
    server_tokens off;
    client_max_body_size 25m;

    root /var/www/tamkobi.com/frontend/build;
    index index.html index.htm;

    # Sertifika sonrası bu blok 443’e taşınır; :80 yalnızca yönlendirir.
    # ssl_certificate     /etc/letsencrypt/live/tamkobi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tamkobi.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # Snippet kuruluysa açın:
    # include snippets/tamkobi-security-headers.conf;

    location = /robots.txt { try_files $uri =404; access_log off; }
    location = /sitemap.xml { try_files $uri =404; access_log off; }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # İstemci XFF’ini ezin — login kilidi bu değere bağlıdır.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location ^~ /downloads/ {
        default_type application/zip;
        types { application/zip zip; }
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
