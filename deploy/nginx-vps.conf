# Production VPS (ixirhost) — matches /etc/nginx/sites-available/tamkobi.com
# Static CRA build + API proxy. Do NOT use deploy/nginx-tamkobi.conf here:
# that file proxies / to :3000 (Docker frontend). This host has no :3000.
#
# Install (only if replacing the live vhost):
#   sudo cp deploy/nginx-vps.conf /etc/nginx/sites-available/tamkobi.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name tamkobi.com www.tamkobi.com 85.95.240.136;

    root /var/www/tamkobi.com/frontend/build;
    index index.html index.htm;

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
