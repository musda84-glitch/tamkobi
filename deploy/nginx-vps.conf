# TLS / canlı VPS şablonu — güncel tam sürüm: deploy/nginx/tamkobi.conf
# Kurulum notları: deploy/nginx/KURULUM.md
#
# Bu dosya geriye dönük uyumluluk için kısa yönlendirme + HTTP fallback içerir.
# Certbot yönetimli vhost’u ezmeyin.

# HTTP → HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name tamkobi.com www.tamkobi.com;
    return 301 https://tamkobi.com$request_uri;
}

# Certbot öncesi geçici HTTP-only (sertifika yokken). Sertifika sonrası
# deploy/nginx/tamkobi.conf kullanın.
# server {
#     listen 80;
#     server_name tamkobi.com;
#     ...
# }
