# TLS template for the live VPS. Do NOT copy this over a certbot-managed
# vhost — that would drop existing certificates. Enable HTTPS with:
#   sudo certbot --nginx -d tamkobi.com -d www.tamkobi.com
#
# Until certbot has issued certs, keep the live HTTP vhost but:
#   - do not list the public IP in server_name (cookies would go to http://IP/)
#   - set X-Forwarded-For / X-Real-IP from $remote_addr only
# deploy/update-native.sh never installs this file.

# server {
#     listen 80;
#     server_name tamkobi.com www.tamkobi.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name tamkobi.com www.tamkobi.com;

    root /var/www/tamkobi.com/frontend/build;
    index index.html index.htm;

    # After certbot, this block moves to 443 and the :80 server only redirects.
    # ssl_certificate     /etc/letsencrypt/live/tamkobi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tamkobi.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Overwrite client XFF — login lockout keys off this value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
