# Public vitrin — point tamkobi.com / www.tamkobi.com A records to this host, then:
#   sudo cp deploy/nginx-tamkobi.conf /etc/nginx/sites-available/tamkobi
#   sudo ln -sf /etc/nginx/sites-available/tamkobi /etc/nginx/sites-enabled/tamkobi
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d tamkobi.com -d www.tamkobi.com
#
# Locally the panel is http://localhost/sistem (port 80). 127.0.0.1 and localhost
# are different origins; this server answers both so either URL hits the same app.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 127.0.0.1 tamkobi.com www.tamkobi.com _;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
