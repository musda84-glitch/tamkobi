services:
  mysql:
    image: mysql:8.0
    container_name: tamkobi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tamkobi
      MYSQL_DATABASE: tamkobi
      MYSQL_USER: tamkobi
      MYSQL_PASSWORD: tamkobi
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - tamkobi_mysql:/var/lib/mysql
      - ./backend/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utamkobi", "-ptamkobi"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  tamkobi_mysql:
