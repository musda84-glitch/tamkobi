name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Aynı anda iki dağıtım çakışmasın; sıradakini iptal etmeden bekletir.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          # script_stop kullanılmıyor: eylem, betiğin her satırından sonra bir çıkış
          # kodu kontrolü enjekte ediyor ve bu, çok satırlı if/else ile for bloklarını
          # bozuyor (appleboy/ssh-action#139, #335). Hata durumunda durmayı betiğin
          # kendi "set -eu" satırı sağlıyor; eylemin önerdiği yol da bu.
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            if [ ! -f deploy/update-native.sh ]; then
              echo "HATA: deploy/update-native.sh yok — sunucu hâlâ eski git geçmişinde." >&2
              echo "Bu VPS Docker kullanmıyor (nginx + venv uvicorn). Bir kez, yedekten sonra:" >&2
              echo "  git branch backup-pre-rewrite-\$(date +%Y%m%d-%H%M)" >&2
              echo "  git fetch origin main" >&2
              echo "  git reset --hard origin/main" >&2
              echo "  sh deploy/update-native.sh --skip-git" >&2
              exit 1
            fi
            sh deploy/update-native.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
