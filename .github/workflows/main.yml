name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Aynı anda iki dağıtım çakışmasın; sıradakini iptal etmeden bekletir.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          # script_stop kullanılmıyor: eylem, betiğin her satırından sonra bir çıkış
          # kodu kontrolü enjekte ediyor ve bu, çok satırlı if/else ile for bloklarını
          # bozuyor (appleboy/ssh-action#139, #335). Hata durumunda durmayı betiğin
          # kendi "set -eu" satırı sağlıyor; eylemin önerdiği yol da bu.
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch origin main
            if ! git cat-file -e origin/main:deploy/update-native.sh; then
              echo "HATA: origin/main'de deploy/update-native.sh yok." >&2
              exit 1
            fi
            # Sunucuda leftover bir stub (Starting native update...) varsa onu
            # çalıştırma — daima GitHub main'deki betiği kullan.
            git show origin/main:deploy/update-native.sh > /tmp/tamkobi-update-native.sh
            sh /tmp/tamkobi-update-native.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
