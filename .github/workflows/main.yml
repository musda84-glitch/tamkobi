name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Aynı anda iki dağıtım çakışmasın; sıradakini iptal etmeden bekletir.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# DEPLOY_USER root değilse: update-native.sh için NOPASSWD sudo gerekir, örn.
#   deploy ALL=(root) NOPASSWD: /bin/sh /var/www/tamkobi.com/deploy/update-native.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Peş peşe merge'lerde SSH handshake reset olabiliyor; birkaç deneme.
      - name: Deploy via SSH
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          timeout: 60s
          # script_stop kullanılmıyor: eylem, betiğin her satırından sonra çıkış
          # kodu kontrolü enjekte ediyor ve çok satırlı if/else ile for'u bozuyor
          # (appleboy/ssh-action#139, #335). Durmayı betiğin "set -eu"sı sağlar.
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git checkout main
            git merge --ff-only origin/main
            sudo sh deploy/update-native.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Wait before SSH retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 25

      - name: Deploy via SSH (retry 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          timeout: 60s
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git checkout main
            git merge --ff-only origin/main
            sudo sh deploy/update-native.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Wait before final SSH retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 40

      - name: Deploy via SSH (retry 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          timeout: 60s
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git checkout main
            git merge --ff-only origin/main
            sudo sh deploy/update-native.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
