<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TamKobi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hdr">
      <div class="brand">TamKobi</div>
      <div class="sub">Hızlı erişim</div>
    </header>

    <nav class="links" id="links">
      <button type="button" data-path="/panel">Panel</button>
      <button type="button" data-path="/hizli-satis">Hızlı Satış</button>
      <button type="button" data-path="/invoices">Faturalar</button>
      <button type="button" data-path="/stock">Stok</button>
      <button type="button" data-path="/sistem">Sistem</button>
      <button type="button" data-path="/web" class="muted">Web / paketler</button>
    </nav>

    <section class="cfg">
      <label for="baseUrl">Kurulum adresi</label>
      <div class="row">
        <input id="baseUrl" type="url" placeholder="https://tamkobi.com" spellcheck="false" />
        <button type="button" id="saveBase" class="save">Kaydet</button>
      </div>
      <p id="status" class="status" hidden></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
