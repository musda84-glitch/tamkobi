server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # /api must stay on this host so <img src="/api/files/..."> previews work on :3000.
    # HTML navigations on :3000 still redirect to host nginx on :80.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Tarayıcı eklentisi ZIP — SPA fallback'e düşmesin
    location ^~ /downloads/ {
        default_type application/zip;
        types { application/zip zip; }
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location / {
        if ($http_host ~* ":3000$") {
            return 301 http://127.0.0.1$request_uri;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
